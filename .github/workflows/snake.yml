# 工作流名称：显示在 GitHub Actions 页面左侧列表中
name: 生成贪吃蛇贡献图动画

on:
  # 定时触发：每天 UTC 时间 00:00（即北京时间早上 08:00）自动执行一次
  schedule:
    - cron: "0 0 * * *"
  # 手动触发：支持在 Actions 页面点击 "Run workflow" 立即执行
  workflow_dispatch:
  # 推送触发：当 main 分支有新的提交推送时触发
  push:
    branches:
      - main

jobs:
  generate:
    # 授予写入权限：确保有权限创建/更新分支并提交文件
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 第一步：拉取仓库代码
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 第二步：获取贡献数据并生成两种配色（明亮/暗黑）的贪吃蛇 SVG 动画
      - name: 生成贪吃蛇动画 SVG 文件
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Oppenheymu
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # 使用 GitHub 内置的 GITHUB_TOKEN，自动管理鉴权，无需手动维护 PAT 密钥
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 第三步：将生成的 SVG 文件发布到独立的 output 分支
      - name: 将生成的 SVG 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
