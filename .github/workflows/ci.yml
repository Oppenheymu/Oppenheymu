# 工作流名称：生成贪吃蛇动画与 3D 城市贡献图
name: 生成贪吃蛇与 3D 城市贡献图

on:
  # 定时触发：每天 UTC 00:00（北京时间 08:00）自动执行
  schedule:
    - cron: "0 0 * * *"
  # 手动触发：支持在 Actions 页面手动点击运行
  workflow_dispatch:
  # 推送触发：当 main 分支有更新时触发构建
  push:
    branches:
      - main

jobs:
  generate:
    name: 构建并部署贡献图资产
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 第一步：拉取贡献数据并生成贪吃蛇动画
      - name: 生成贪吃蛇动画 SVG 文件
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Oppenheymu
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 第二步：生成 3D 城市立体贡献图（默认生成北半球四季、南半球、经典绿、暗黑等全套版本）
      - name: 生成 3D 城市立体贡献图
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Oppenheymu

      # 第三步：将生成的 3D 资源合并移动到 dist 目录中，便于统一发布
      - name: 整合所有 SVG 文件至 dist 目录
        run: |
          mkdir -p dist/profile-3d-contrib
          cp -r profile-3d-contrib/* dist/profile-3d-contrib/

      # 第四步：将 dist 目录的所有文件推送到 output 分支
      - name: 发布资源文件到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}